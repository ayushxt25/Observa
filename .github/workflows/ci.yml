name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: observa
          POSTGRES_USER: observa
          POSTGRES_PASSWORD: observa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U observa -d observa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://observa:observa@localhost:5432/observa
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-jwt-secret-change-me-32-bytes
      NOTIFICATION_SECRET_KEY: ci-only-notification-secret-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m pytest
        working-directory: backend
